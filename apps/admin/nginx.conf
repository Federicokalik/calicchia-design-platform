# nginx config for the admin SPA.
# Serves the static Vite build and proxies /api + /media to the api service
# (same-origin → the auth cookie stays first-party on the admin domain).

server {
    listen 80;
    # IPv6 obbligatorio: in Alpine `localhost` risolve a `::1` prima di
    # `127.0.0.1`, e l'HEALTHCHECK del Dockerfile fa wget http://localhost/.
    # Senza questa riga il connect su `[::1]:80` viene rifiutato → il container
    # resta `unhealthy` in eterno → Dokploy non lo instrada (Traefik 404).
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Portfolio media uploads (cover, gallery, before/after PNG screenshots) POST
    # to /api/media/upload. The API caps files at 50MB — without this directive
    # nginx's 1MB default 413s any real screenshot before it reaches the API,
    # and the editor shows nothing. Keep in sync with MAX_FILE_SIZE in
    # apps/api/src/routes/media.ts (55m = 50MB + multipart overhead headroom).
    client_max_body_size 55m;

    # Docker embedded DNS. Used with a variable in proxy_pass below so nginx
    # resolves "api" at request time, not at startup — otherwise nginx refuses
    # to start whenever the api container is not yet up (cold start, redeploy).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Ripristino backup: l'API accetta fino a 200 MB (bodyLimit in app.ts), il
    # limite globale di 55m restituiva un 413 di nginx sui backup più grandi.
    location = /api/backup/import {
        client_max_body_size 210m;
        proxy_request_buffering off;
        set $upstream_api http://api:3001;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # API proxy — "api" is the compose service name on the internal network.
    location /api/ {
        set $upstream_api http://api:3001;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /media/ {
        set $upstream_media http://api:3001;
        proxy_pass $upstream_media;
        proxy_set_header Host $host;
    }

    # SPA fallback — client-side routing (react-router v7).
    # Header di sicurezza sulle pagine dell'admin (l'API li mette solo sulle
    # sue risposte, non duplicati qui): niente framing da siti terzi
    # (clickjacking su "Ripristina database", "Cancella dati" GDPR…).
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Static assets — long cache (Vite emits content-hashed filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
