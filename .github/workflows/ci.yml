name: CI

# Gate qualità sulle PR verso main: typecheck, lint e build di tutti i workspace,
# più i test dell'API su Postgres effimero (job api-tests) e l'integrazione del
# calendario con un Radicale 3.7.8 reale (job calendar-integration).
# NB: il job "build" intercetta volutamente il finding AD-01 (build admin rotta)
# finché non viene risolto — è la CI che fa il suo lavoro.
#
# Non gira più su push a main: su push la qualità per-app è coperta dai workflow
# build-*-image.yml (typecheck/lint + build dell'immagine). Il deploy è gestito
# da quegli stessi workflow (build immagine → ghcr.io → notifica Dokploy).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck — api
        run: pnpm --filter @calicchia/api typecheck

      - name: Typecheck — calendar-core
        run: pnpm --filter @calicchia/calendar-core typecheck

      - name: Typecheck — mcp
        run: pnpm --filter @calicchia/mcp typecheck

      - name: Typecheck — sito-v3
        run: pnpm --filter @calicchia/sito-v3 typecheck

      - name: Lint — sito-v3
        run: pnpm --filter @calicchia/sito-v3 lint

      - name: Lint — admin
        run: pnpm --filter @calicchia/admin lint

      - name: Build — api
        run: pnpm --filter @calicchia/api build

      - name: Build — admin
        run: pnpm --filter @calicchia/admin build

      - name: Build — sito-v3
        run: pnpm --filter @calicchia/sito-v3 build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_TELEMETRY_DISABLED: '1'

  # Smoke test e2e dell'API contro un Postgres effimero.
  api-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: caldes
          POSTGRES_USER: caldes
          POSTGRES_PASSWORD: caldes
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U caldes"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://caldes:caldes@localhost:5432/caldes
      JWT_SECRET: ci-test-secret-not-for-production-use-only
      WEBHOOK_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run migrations
        run: pnpm --filter @calicchia/api migrate
      # NB: test-e2e.ts va riparato (vedi REPORT-07 TQ-02) prima di renderlo bloccante.
      - name: API e2e smoke (non-blocking finché TQ-02 non è risolto)
        run: pnpm --filter @calicchia/api test:e2e
        continue-on-error: true

  # Test dell'API (node:test eseguito da tsx, vedi apps/api/test/README.md)
  # contro un Postgres 17 effimero: smoke dell'infrastruttura, contratti e casi
  # del calendario. Qui le suite che richiedono Radicale vengono saltate (con il
  # motivo): girano nel job calendar-integration. Prima, senza servizi, i test
  # di @calicchia/calendar-core (parse, serialize, espansione, patch, feed).
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: caldes_test
          POSTGRES_USER: caldes
          POSTGRES_PASSWORD: caldes
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U caldes -d caldes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # helpers/env.ts accetta solo localhost e nomi con 'test' o 'caldes_f<N>'.
      TEST_DATABASE_URL: postgresql://caldes:caldes@localhost:5432/caldes_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Senza database né Radicale (circa 6 s): l'oracolo dateutil è
      # precalcolato in test/fixtures/rrule-golden.json.
      - name: Test di @calicchia/calendar-core
        run: pnpm --filter @calicchia/calendar-core test
      # Senza database: segnala subito una modifica alla lista vincolante dei
      # tool MCP di calendario (il test di contratto la confronta comunque).
      - name: Contratto MCP (schema dei tool di calendario)
        run: pnpm --filter @calicchia/api contract:mcp-check
      # Stesso runner del boot dell'API, sul solo database dei test (non usa .env).
      - name: Migrazioni
        run: pnpm --filter @calicchia/api test:migrate
      - name: Typecheck dei test
        run: pnpm --filter @calicchia/api typecheck:test
      - name: Test API
        run: pnpm --filter @calicchia/api test

  # Integrazione del calendario con un Radicale 3.7.8 reale (pin del design
  # §3.1, harness F0 in apps/api/test/helpers/radicale.ts): smoke CalDAV,
  # limitazioni di vobject, plugin caldes_auth e caldes_rights del repository
  # (pytest e lato API), client di servizio e control-plane, end-to-end del
  # criterio di uscita della F1 (config di produzione, verify-credentials
  # dell'API vera), inventario in sola lettura e i moduli della F2 contro
  # Radicale reale (sync, rebuild dell'indice, RadicaleStore, decisioni di
  # prenotazione, consumatori, specchio delle iscrizioni). La matrice
  # CALENDAR_BACKEND=postgres|radicale dei contratti F0 (design §15) è ancora
  # da preparare: oggi i contratti girano solo su PgLegacyStore (job api-tests).
  calendar-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: caldes_test
          POSTGRES_USER: caldes
          POSTGRES_PASSWORD: caldes
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U caldes -d caldes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # helpers/env.ts accetta solo localhost e nomi con 'test' o 'caldes_f<N>'.
      TEST_DATABASE_URL: postgresql://caldes:caldes@localhost:5432/caldes_test
      # Senza Radicale i test falliscono invece di essere saltati.
      RADICALE_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Venv fuori dal repository; il mock di verify-credentials usa il python
      # dello stesso venv (RADICALE_PYTHON non serve). I peer 127.0.0.2 e
      # 127.0.0.3 dei test di F1 funzionano sul loopback /8 del runner, senza
      # reti Docker dedicate. pytest serve ai test dei plugin.
      - name: Radicale 3.7.8 (venv)
        run: |
          python -m venv "$RUNNER_TEMP/radicale-venv"
          "$RUNNER_TEMP/radicale-venv/bin/pip" install --disable-pip-version-check --no-input 'radicale==3.7.8' 'vobject==0.9.9' 'pytest==9.1.1'
          test "$("$RUNNER_TEMP/radicale-venv/bin/radicale" --version)" = "3.7.8"
          echo "RADICALE_BIN=$RUNNER_TEMP/radicale-venv/bin/radicale" >> "$GITHUB_ENV"
          echo "RADICALE_VENV=$RUNNER_TEMP/radicale-venv" >> "$GITHUB_ENV"
      # Gli stessi test del workflow dell'immagine (build-radicale-image.yml),
      # qui anche sulle PR che toccano solo l'API: il contratto del
      # control-plane e il mock di verify-credentials sono condivisi.
      - name: Test dei plugin di Radicale (pytest)
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/radicale/plugins
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RADICALE_VENV/bin/python" apps/radicale/plugins/caldes_selftest.py apps/radicale/config/config
          "$RADICALE_VENV/bin/pytest" -p no:cacheprovider -ra apps/radicale/tests
      - run: pnpm install --frozen-lockfile
      - name: Migrazioni
        run: pnpm --filter @calicchia/api test:migrate
      - name: Typecheck dei test
        run: pnpm --filter @calicchia/api typecheck:test
      - name: Test di integrazione (Radicale reale, plugin del repository, end-to-end F1, inventario, moduli F2)
        run: pnpm --filter @calicchia/api test:integration
