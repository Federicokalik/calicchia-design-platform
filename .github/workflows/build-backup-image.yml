name: build-backup-image

# Immagine del servizio `backup` dello stack (apps/backup/): backup coordinato
# del database e del volume di Radicale (scripts/backup-calendar-stack.sh),
# pianificato e comandabile dall'admin.
#
# - Nelle pull request l'immagine si builda soltanto: il self-test nel
#   Dockerfile (versioni di pg_dump, strumenti GNU, sintassi degli script)
#   fa fallire la build.
# - Su main push su ghcr.io con il solo tag `sha-<short>`. Niente `latest`,
#   come per Radicale: il compose di produzione usa un tag sha che cambia solo
#   con un commit del compose (deploy in due commit, apps/backup/README.md).

on:
  push:
    branches: [main]
    paths:
      - 'apps/backup/**'
      - 'scripts/backup-calendar-stack.sh'
      - 'scripts/calendar_stack.py'
      - '.github/workflows/build-backup-image.yml'
  pull_request:
    paths:
      - 'apps/backup/**'
      - 'scripts/backup-calendar-stack.sh'
      - 'scripts/calendar_stack.py'
      - '.github/workflows/build-backup-image.yml'
  workflow_dispatch:

concurrency:
  group: build-backup-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: federicokalik/calicchia-backup

jobs:
  build:
    name: build e push dell'immagine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Sintassi degli script (bash -n)
        run: |
          bash -n apps/backup/runner.sh
          bash -n scripts/backup-calendar-stack.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Estrai metadata immagine
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build (e push fuori dalle pull request)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backup/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Tag per docker-compose.portainer.yml
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Immagine del servizio backup pubblicata"
            echo
            echo "Da scrivere in \`docker-compose.portainer.yml\` (servizio \`backup\`, anche in \`CALDES_BACKUP_VERSION\`) nel commit 2 del deploy:"
            echo
            echo '```'
            echo "image: ${TAGS}"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
